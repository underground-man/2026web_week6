<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 등록</title>

    <!-- Bootstrap 5.3.8: AI가 제안한 CDN을 공식 문서와 대조하여 적용 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!--
    AI 활용 Bootstrap UI 구간
    직접 확인한 연결: POST /movies, th:action="@{/movies}", method="post",
    MovieRequest와 일치하는 name(title, director, rating, pubyear, category)
-->
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-9 col-lg-7">
            <header class="mb-4">
                <p class="page-kicker mb-1">NEW ENTRY</p>
                <h1 class="display-6 fw-bold mb-2">새 영화 등록</h1>
                <p class="text-secondary mb-0">영화 정보를 입력하면 메모리 저장소에 등록됩니다.</p>
            </header>

            <form class="movie-form card border-0 shadow-sm p-4 p-md-5"
                  th:action="@{/movies}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label" for="title">제목</label>
                    <input class="form-control"
                           type="text"
                           id="title"
                           name="title"
                           placeholder="영화 제목">
                </div>

                <div class="mb-3">
                    <label class="form-label" for="director">감독</label>
                    <input class="form-control"
                           type="text"
                           id="director"
                           name="director"
                           placeholder="감독 이름">
                </div>

                <div class="row">
                    <div class="col-12 col-sm-6 mb-3">
                        <label class="form-label" for="rating">평점</label>
                        <input class="form-control"
                               type="number"
                               id="rating"
                               name="rating"
                               min="0"
                               placeholder="0 이상">
                    </div>

                    <div class="col-12 col-sm-6 mb-3">
                        <label class="form-label" for="pubyear">개봉 연도</label>
                        <input class="form-control"
                               type="number"
                               id="pubyear"
                               name="pubyear"
                               placeholder="예: 2026">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="category">카테고리</label>
                    <input class="form-control"
                           type="text"
                           id="category"
                           name="category"
                           placeholder="예: 드라마">
                </div>

                <div class="d-flex flex-column flex-sm-row gap-2">
                    <button class="btn btn-primary px-4"
                            type="submit">
                        등록
                    </button>

                    <a class="btn btn-outline-secondary px-4"
                       th:href="@{/movies}">
                        목록으로 돌아가기
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>

</body>
</html>
